resourceGroup:
  name: "your-resource-group-name"
  location: "Switzerland North"
  tags:
    Purpose: "Demo"

network:
  vnet:
    addressPrefix: "192.168.0.0/16"
  subnet:
    addressPrefix: "192.168.1.0/24"
  publicIp:
    enabled: false
    allocationMethod: "Static"
    idleTimeoutInMinutes: 4

securityRules: []

keyVault:
  name: "Your-Key-Vault-Name"
  storageKeySecretName: "storage-account-key"
  vmAdminPasswordSecretName: "vm-admin-password"
  passwordLength: 24

credentials:
  username: "youradminusername"

vm:
  size: "Standard_DS13_V2"
  image:
    publisherName: "MicrosoftSQLServer"
    offer: "sql2022-ws2022"
    skus: "sqldev-gen2"
    version: "latest"

bastion:
  subnetAddressPrefix: "192.168.2.0/24"
  sku: "Basic"
  publicIp:
    allocationMethod: "Static"
    idleTimeoutInMinutes: 4
    sku: "Standard"

storage:
  resourceGroup: "YourResourceGroupNameForStorage"
  accountName: "yourbackstorageaccount"
  skuName: "Standard_LRS"
  fileShareName: "sqlbackupshare"
  driveLetter: "Z"
  backupPath: '\'

softwareInstalls:
  allowDynamicBootstrap: true
  chocolatey:
    bootstrapUrl: "https://community.chocolatey.org/install.ps1"
  packages:
    - manager: "Chocolatey"
      name: "git.install"
      version: "2.54.0"
      sourceUri: "https://community.chocolatey.org/packages/git.install"
    - manager: "Chocolatey"
      name: "powershell-core"
      version: "7.6.3"
      sourceUri: "https://community.chocolatey.org/packages/powershell-core"
    - manager: "Chocolatey"
      name: "tabular-editor"
      version: "2.28.0"
      sourceUri: "https://community.chocolatey.org/packages/tabular-editor"
    - manager: "PowerShellGallery"
      name: "dbatools"
      version: "2.7.25"
      sourceUri: "https://www.powershellgallery.com/packages/dbatools/2.7.25"
  installScript: |
    Import-Module dbatools
  logonScript: |
    code --install-extension ms-mssql.mssql
