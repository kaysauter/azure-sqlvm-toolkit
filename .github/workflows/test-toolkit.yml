name: Test toolkit

on:
  push:
    branches: [main]
    paths:
      - "*.ps1"
      - "*.psm1"
      - "*.psd1"
      - "VERSION"
      - "config.yaml"
      - "Public/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - "docs-site/**"
      - ".github/workflows/test-toolkit.yml"
  pull_request:
    paths:
      - "*.ps1"
      - "*.psm1"
      - "*.psd1"
      - "VERSION"
      - "config.yaml"
      - "Public/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - "docs-site/**"
      - ".github/workflows/test-toolkit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PowerShell modules
        shell: pwsh
        run: |
          Install-Module -Name powershell-yaml -RequiredVersion 0.4.12 -Scope CurrentUser -Force
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run local toolkit checks
        shell: pwsh
        run: ./scripts/Test-Local.ps1 -ConfigFile config.yaml

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Build documentation
        run: npm run build
