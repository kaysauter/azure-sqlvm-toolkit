name: Release toolkit

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PowerShell modules
        run: |
          Install-Module -Name powershell-yaml -RequiredVersion 0.4.12 -Scope CurrentUser -Force
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Validate version and tag
        id: version
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { $null }
          $versionInfo = ./scripts/Test-Version.ps1 -ExpectedTag $tag
          "version=$($versionInfo.Version)" >> $env:GITHUB_OUTPUT
          "tag=$($versionInfo.Tag)" >> $env:GITHUB_OUTPUT

      - name: Run toolkit checks
        run: ./scripts/Test-Local.ps1 -ConfigFile config.yaml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Audit docs dependencies
        working-directory: docs-site
        shell: bash
        run: npm run audit:dependencies

      - name: Install docs dependencies
        working-directory: docs-site
        shell: bash
        run: npm ci

      - name: Build docs
        working-directory: docs-site
        shell: bash
        run: npm run build

      - name: Package module
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $staging = Join-Path $PWD "dist/AzureSqlVmToolkit"
          New-Item -Path $staging -ItemType Directory -Force | Out-Null
          $items = @(
            "AzureSqlVmToolkit.psd1",
            "AzureSqlVmToolkit.psm1",
            "VERSION",
            "README.md",
            "Getting-Started.md",
            "Security.md",
            "Licensing.md",
            "LICENSE",
            "config.yaml",
            "vm_creation_with_bastion.ps1",
            "Public",
            "scripts",
            "schemas"
          )
          foreach ($item in $items) {
            Copy-Item -Path $item -Destination $staging -Recurse -Force
          }
          Compress-Archive -Path $staging -DestinationPath "dist/AzureSqlVmToolkit-$version.zip" -Force

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $version = "${{ steps.version.outputs.version }}"
          $asset = "dist/AzureSqlVmToolkit-$version.zip"
          $notes = "Release $version. See CHANGELOG.md in the repository for curated changes and compatibility notes."
          $args = @("release", "create", $tag, $asset, "--title", "AzureSqlVmToolkit $version", "--notes", $notes)
          if ("${{ github.event.inputs.prerelease }}" -eq "true") {
            $args += "--prerelease"
          }
          gh @args
