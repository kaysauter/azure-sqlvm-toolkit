<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 760 220">
  <title id="title">AzureSqlVmToolkit logo</title>
  <desc id="desc">An abstract secure deployment mark made from layered blue paths and a protected center.</desc>
  <defs>
    <linearGradient id="pathGradient" x1="43" x2="203" y1="32" y2="189" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8" />
      <stop offset=".48" stop-color="#2563eb" />
      <stop offset="1" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="coreGradient" x1="88" x2="166" y1="70" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f8fafc" />
      <stop offset="1" stop-color="#dbeafe" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="13" stdDeviation="14" flood-color="#0f172a" flood-opacity=".16" />
    </filter>
    <style>
      .word {
        fill: #0f172a;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 42px;
        font-weight: 800;
        letter-spacing: 0;
      }
      .tagline {
        fill: #475569;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 18px;
        font-weight: 500;
        letter-spacing: 0;
      }
      @media (prefers-color-scheme: dark) {
        .word { fill: #f8fafc; }
        .tagline { fill: #cbd5e1; }
      }
    </style>
  </defs>

  <g filter="url(#softShadow)">
    <path d="M125 22 208 70v82l-83 48-83-48V70l83-48Z" fill="#eff6ff" />
    <path d="M125 22 208 70v82l-83 48-83-48V70l83-48Z" fill="url(#pathGradient)" opacity=".92" />
    <path d="M125 46 187 82v59l-62 36-62-36V82l62-36Z" fill="#0f172a" opacity=".12" />

    <path d="M66 78 126 44l59 34-59 34-60-34Z" fill="#bae6fd" opacity=".92" />
    <path d="M66 112 126 78l59 34-59 34-60-34Z" fill="#60a5fa" opacity=".88" />
    <path d="M66 146 126 112l59 34-59 34-60-34Z" fill="#1d4ed8" opacity=".88" />

    <path d="M93 96 126 77l33 19v37l-33 19-33-19V96Z" fill="url(#coreGradient)" />
    <path d="M108 102h36v28c0 11-7 19-18 24-11-5-18-13-18-24v-28Z" fill="#1e3a8a" opacity=".28" />
    <path d="M116 101v-7c0-7 5-13 11-13s11 6 11 13v7" fill="none" stroke="#0f172a" stroke-width="7" stroke-linecap="round" opacity=".32" />

  </g>

  <text class="word" x="254" y="92">AzureSqlVmToolkit</text>
  <text class="tagline" x="256" y="127">secure, repeatable SQL Server VM labs for Azure</text>
  <path d="M257 150h340" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity=".72" />
</svg>
